# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # Prospector-free split: roBa_R is the central connected to the PC.
  - board: seeeduino_xiao_ble
    shield: roBa_L
    artifact-name: roBa_L_no_prospector_peripheral
  - board: seeeduino_xiao_ble
    shield: roBa_R
    snippet: studio-rpc-usb-uart
    artifact-name: roBa_R_no_prospector_central

  # Left-hand-only pseudo Codex Micro: direct USB/BLE HID, no split central.
  - board: seeeduino_xiao_ble
    shield: roBaCodexL
    snippet: studio-rpc-usb-uart
    artifact-name: roBa_L_codex_standalone

  # Dongle configuration: both keyboard halves are BLE peripherals.
  - board: seeeduino_xiao_ble
    shield: roBa_L
    artifact-name: roBa_L_peripheral
  - board: seeeduino_xiao_ble
    shield: roBa_R_peripheral
    artifact-name: roBa_R_peripheral
  - board: seeeduino_xiao_ble
    shield: roBa_dongle prospector_adapter
    artifact-name: roBa_prospector_dongle
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset
